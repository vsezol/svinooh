# The gates for libs/portfolio-py, the package apps/agent and apps/mcp both
# read a portfolio with. Their own workflows run on a change here as well.
name: portfolio-py

on:
  push:
    branches: [main]
    paths:
      - libs/portfolio-py/**
      - .github/workflows/portfolio-py.yml
  pull_request:
    paths:
      - libs/portfolio-py/**
      - .github/workflows/portfolio-py.yml

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/portfolio-py
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: libs/portfolio-py/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q
