# The gates for everything TypeScript: the same two commands a developer runs
# locally, over every workspace at once. The Python services (apps/agent,
# apps/mcp, libs/portfolio-py) have their own workflows and are excluded here.
name: node

on:
  push:
    branches: [main]
    paths:
      - apps/**
      - '!apps/agent/**'
      - '!apps/mcp/**'
      - libs/**
      - '!libs/portfolio-py/**'
      - package.json
      - package-lock.json
      - nx.json
      - tsconfig.base.json
      - .github/workflows/node.yml
  pull_request:
    paths:
      - apps/**
      - '!apps/agent/**'
      - '!apps/mcp/**'
      - libs/**
      - '!libs/portfolio-py/**'
      - package.json
      - package-lock.json
      - nx.json
      - tsconfig.base.json
      - .github/workflows/node.yml

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The queue's contract tests (libs/common/test/queue.test.ts) run against a
    # real Redis and skip themselves without one
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The install is the slow half of this job, and it only changes when the
      # lockfile does.
      - uses: actions/cache@v6
        id: installed
        with:
          path: |
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.installed.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false --prefer-offline
      # Both targets build the libraries they depend on first, so the Prisma
      # client and the shared dist are there before anything imports them.
      - run: npm test
        env:
          QUEUE_TEST_REDIS_URL: redis://localhost:6379/15
      - run: npm run typecheck
