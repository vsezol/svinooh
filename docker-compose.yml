# Local development: Postgres only. The services and web run via `npm run dev`.
# RabbitMQ, Redis, Loki and Tempo are optional — without their variables the
# services fall back to in-process scanning, an in-memory cache and stdout logs.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: svinooh
      POSTGRES_PASSWORD: svinooh
      POSTGRES_DB: svinooh
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
