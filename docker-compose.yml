# Local development. `docker compose up -d` gives you the two things the
# services genuinely cannot fake: a database and the queue.
#
# The queue used to be optional, and the wallet service carried a second,
# queue-less implementation of the whole scan pipeline to cope. Two pipelines
# meant two behaviours — the fallback skipped EVM entirely and paced itself
# differently — and only one of them was the one that runs in production. It is
# cheaper to run Redis locally than to keep a shadow copy of the system honest.
# A Redis already running on 6379 (brew) does just as well; then start only db.
#
# Loki and Tempo stay optional: without their variables the services log to
# stdout, which is the same code path either way.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: svinooh
      POSTGRES_PASSWORD: svinooh
      POSTGRES_DB: svinooh
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # The same persistence production runs: a snapshot a minute, no AOF
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6379:6379"   # REDIS_URL=redis://localhost:6379
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
