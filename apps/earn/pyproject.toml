[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svinooh-earn"
version = "1.0.0"
description = "Where a single token can be deposited to earn a rate, across chains and protocols."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Every upstream call goes through this (infrastructure/httpx_client.py)
    "httpx>=0.27",
    # The wire contract is declared, not hand-serialised (api/schemas.py)
    "pydantic>=2.9",
    # Configuration is parsed and validated like anything else that crosses a
    # boundary — the environment is untrusted input (infrastructure/settings.py)
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["earn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade — modern syntax for the Python we actually run
    "B",        # bugbear
    "SIM",      # simplifications
    "RUF",      # ruff's own
    "ANN",      # every signature is annotated; mypy has nothing to guess
    "TID252",   # no relative imports beyond one level
]
ignore = ["ANN401"]  # explicit `Any` is how an upstream payload is typed before mapping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # a test's signature is its name

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Layer rule, enforced rather than documented: the domain imports nothing from
# the outside, and infrastructure/api may not be imported by it. mypy cannot
# express that directly — tests/test_layering.py does.
warn_unreachable = true

[[tool.mypy.overrides]]
# Tests are checked, but not made to carry annotations that say nothing: a test
# returns None and its name is its documentation. `disallow_incomplete_defs` is
# the one that matters here — a test taking a typed fixture and returning
# nothing is "partially annotated", which strict mode reports by default.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
