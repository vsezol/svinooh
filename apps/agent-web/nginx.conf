# Static hosting for the agent frontend. ${PORT} is substituted at startup by
# the nginx image's envsubst step; nginx's own $uri and friends survive it
# because they are not environment variables.

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;

    # Anything carrying a content hash in its name — the entry and every chunk
    # — can never mean two different files, which is what makes a year of
    # caching safe.
    location ~ "^/[A-Za-z0-9_-]+\.[0-9a-f]{8}\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The federation entry keeps its name across deploys, because that is the
    # name hosts write down — so a host that cached it would keep loading the
    # previous build's chunk names.
    #
    # This says 60 seconds and means it, but it is a request rather than an
    # instruction: a CDN in front of this rewrote it to four hours, and the
    # chat kept arriving from the morning's deploy long after the merge. The
    # thing that actually holds is on the host's side — it asks for this file
    # with a minute-stamp on the query, and no cache collapses two URLs into
    # one. See AgentEmbed.
    location = /remoteEntry.js {
        add_header Cache-Control "public, max-age=60";
    }

    # Every route is the same page: the app reads the path to decide what to
    # render (/demo is the kitchen sink).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
