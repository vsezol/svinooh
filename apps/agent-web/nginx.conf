# Static hosting for the agent frontend. ${PORT} is substituted at startup by
# the nginx image's envsubst step; nginx's own $uri and friends survive it
# because they are not environment variables.

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;

    # Chunks carry a content hash in the name, so a name can never mean two
    # different files.
    location ~ "^/[0-9]+\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The federation entry keeps its name across deploys, so a host that cached
    # it for long would keep loading the previous build's chunk names.
    location = /remoteEntry.js {
        add_header Cache-Control "public, max-age=60";
    }

    # Every route is the same page: the app reads the path to decide what to
    # render (/demo is the kitchen sink).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
