<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>svinooh agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The host product supplies these variables via next/font; the
         standalone page maps them to the Google Fonts faces above. */
      :root {
        --font-manrope: 'Manrope';
        --font-plex-mono: 'IBM Plex Mono';
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        /* Dark ground before any bundle CSS arrives — no white flash. */
        background: #08090c;
      }
      #root {
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
