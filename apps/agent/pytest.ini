[pytest]
# Tests import the service as `app.*` and its fixtures as `tests.*`, so the
# service directory is the root of both.
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
    contract: checks the live API still sends the shape the fixtures claim (needs network)
# Contract tests are opt-in: the default run is deterministic and offline.
addopts = -m "not contract"
