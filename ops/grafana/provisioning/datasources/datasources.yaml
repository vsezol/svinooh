# Datasources as code, read on every start. The uids are pinned by hand — the
# dashboards in ../../dashboards reference them, and a Grafana-generated uid
# only exists in the instance that happened to create it.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.railway.internal:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.railway.internal:3100
    # Tempo (traces) was removed — it idled at ~0.5 GB for tracing nobody read.
    # Logs (Loki) and metrics (Prometheus) stay. To bring tracing back, re-add a
    # Tempo datasource here and a Loki derivedFields TraceID link into it.
