# Datasources as code, read on every start. The uids are pinned by hand — the
# dashboards in ../../dashboards reference them, and a Grafana-generated uid
# only exists in the instance that happened to create it.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.railway.internal:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.railway.internal:3100
    jsonData:
      derivedFields:
        # Every log line written inside a traced request carries trace_id=<id>
        # (see LokiLogger). This turns it into a link straight to that trace.
        - name: TraceID
          matcherType: regex
          matcherRegex: 'trace_id=([0-9a-f]{32})'
          url: '${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo.railway.internal:3200
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
      # And back the other way: from a span to the logs of that request
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        filterByTraceID: true
        tags:
          - key: service.name
            value: app
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags:
          - key: service.name
            value: app
