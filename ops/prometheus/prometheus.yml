# Prometheus for svinooh. Scrapes the services over Railway's internal network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: svinooh

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: svinooh-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api.railway.internal:3000']

  - job_name: svinooh-auth
    metrics_path: /metrics
    static_configs:
      - targets: ['auth.railway.internal:3000']

  - job_name: svinooh-wallet
    metrics_path: /metrics
    static_configs:
      - targets: ['wallet.railway.internal:3000']

  # The observability stack watches itself too — if log or trace ingestion
  # breaks, that should be visible here rather than by noticing missing data
  - job_name: loki
    static_configs:
      - targets: ['loki.railway.internal:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo.railway.internal:3200']
