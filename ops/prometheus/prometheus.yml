# Prometheus for svinooh. Scrapes the services over Railway's internal network.
global:
  # 60s, not 15s: for a one-user project 15-second resolution buys nothing and
  # quadruples the samples the TSDB has to hold. rate() queries use a [5m]+
  # window, which is still 5+ points here.
  scrape_interval: 60s
  evaluation_interval: 60s
  external_labels:
    project: svinooh

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: svinooh-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api.railway.internal:3000']

  - job_name: svinooh-auth
    metrics_path: /metrics
    static_configs:
      - targets: ['auth.railway.internal:3000']

  - job_name: svinooh-wallet
    metrics_path: /metrics
    static_configs:
      - targets: ['wallet.railway.internal:3000']

  # The agent counts the same HTTP series as the others, plus its own: turns,
  # the models they call, and the tools those call.
  - job_name: svinooh-agent
    metrics_path: /metrics
    static_configs:
      - targets: ['agent.railway.internal:3000']

  # The observability stack watches itself too — if log ingestion breaks, that
  # should be visible here rather than by noticing missing data
  - job_name: loki
    static_configs:
      - targets: ['loki.railway.internal:3100']
