# What the agent and the MCP server both read a portfolio with: its model, the
# portfolio API's wire, a client for that API, and the plain-text readings a
# model is handed. No framework, no model library: only what reading needs.

[project]
name = "svinooh-portfolio-py"
version = "0.0.1"
description = "Read a svinooh portfolio over its public API and say what is in it."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "svinooh_portfolio"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["PT018"]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "PT", "T20", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
